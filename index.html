<meta name="theme-color" content="#14233B">

<style>
/* Cairn Affinités — design 2026 : fond lin à halos doux, cartes arrondies flottantes, boutons pilule, échelle de réponse tactile. */
:root {
  --bg: #F4F1EA;
  --surface: #FFFFFF;
  --surface-2: #FAF8F4;
  --ink: #14233B;
  --muted: #5A667C;
  --sky: #2F7FB8;
  --sky-2: #5BA7DB;
  --sky-soft: #E3EFF8;
  --line: #E4DED3;
  --line-strong: #D3CBBD;
  --dir: #14233B;
  --team: #2F7FB8;
  --cand: #8A3F7A;
  --ok: #2B7355; --ok-bg: #DFF1E7;
  --warn: #8F5E12; --warn-bg: #F8EBCF;
  --crit: #A63A31; --crit-bg: #F8E0DC;
  --on-ink: #F7F4EE;
  --glow-1: rgba(91,167,219,.28);
  --glow-2: rgba(214,180,140,.30);
  --shadow: 0 1px 2px rgba(20,35,59,.04), 0 10px 30px -12px rgba(20,35,59,.14);
  --shadow-lg: 0 2px 4px rgba(20,35,59,.04), 0 24px 48px -20px rgba(20,35,59,.28);
  --glass: rgba(244,241,234,.72);
  --display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 20px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1422; --surface: #142034; --surface-2: #18263C; --ink: #E9EEF6; --muted: #9DAAC0;
    --sky: #7DBDE8; --sky-2: #A9D4F2; --sky-soft: #1B3250; --line: #24344D; --line-strong: #31445F;
    --dir: #EDE6D6; --team: #7DBDE8; --cand: #DB94CC;
    --ok: #6CC79B; --ok-bg: #163829; --warn: #E3B05A; --warn-bg: #3A2D12;
    --crit: #EE8A80; --crit-bg: #441F1B; --on-ink: #0C1422;
    --glow-1: rgba(125,189,232,.16); --glow-2: rgba(219,148,204,.10);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -12px rgba(0,0,0,.5);
    --shadow-lg: 0 24px 48px -20px rgba(0,0,0,.6);
    --glass: rgba(12,20,34,.72);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh;
  background:
    radial-gradient(60rem 40rem at 110% -10%, var(--glow-1), transparent 60%),
    radial-gradient(50rem 36rem at -20% 30%, var(--glow-2), transparent 60%),
    var(--bg);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--body); font-size: 16px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
.topbar {
  position: sticky; top: 0; z-index: 10;
  background: var(--glass);
  -webkit-backdrop-filter: saturate(160%) blur(14px); backdrop-filter: saturate(160%) blur(14px);
  border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
  padding-top: env(safe-area-inset-top, 0px);
}
.topbar-in { max-width: 680px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
header.brand { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; }
header.brand svg { flex: none; }
.brand-name { font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: -.01em; line-height: 1.1; }
.brand-sub { color: var(--muted); font-size: 12px; letter-spacing: .02em; }
.topbar .chip { margin-left: auto; }
.wrap {
  max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px;
  padding: 28px 16px calc(56px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.15; letter-spacing: -.02em; }
h1 { font-size: clamp(30px, 7vw, 42px); font-weight: 700; }
h2 { font-size: 21px; font-weight: 600; }
h3 { font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
p { margin: 0; }
.lead { color: var(--muted); font-size: 17px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-lg { display: flex; flex-direction: column; gap: 20px; }
.label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 22px; box-shadow: var(--shadow);
}
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row > .grow { flex: 1 1 180px; min-width: 0; }
.small { font-size: 13.5px; color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* Hero & atouts */
.hero { display: flex; flex-direction: column; gap: 14px; padding-top: 8px; }
.eyebrow {
  align-self: flex-start; display: inline-flex; align-items: center; gap: 8px;
  font-size: 12.5px; font-weight: 600; color: var(--sky);
  background: var(--sky-soft); padding: 6px 12px; border-radius: 999px;
}
.eyebrow::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--sky); box-shadow: 0 0 0 4px color-mix(in srgb, var(--sky) 22%, transparent); }
.hl { background: linear-gradient(100deg, var(--sky), var(--cand)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.atouts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.atout { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 4px; box-shadow: var(--shadow); }
.atout b { font-family: var(--display); font-size: 15px; letter-spacing: -.01em; }
.atout span { font-size: 12.5px; color: var(--muted); line-height: 1.4; }
.atout i { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; font-style: normal; font-size: 15px; background: var(--sky-soft); color: var(--sky); margin-bottom: 4px; }
@media (max-width: 480px) { .atouts { grid-template-columns: 1fr; } .atout { flex-direction: row; align-items: center; gap: 12px; } .atout i { margin: 0; flex: none; } .atout div { display: flex; flex-direction: column; } }
.chip { font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }

/* Boutons */
button, .btn {
  font: inherit; font-weight: 600; font-size: 15px; cursor: pointer;
  border-radius: 999px; border: 1px solid transparent;
  background: linear-gradient(180deg, color-mix(in srgb, var(--ink) 88%, var(--sky)), var(--ink));
  color: var(--on-ink);
  padding: 12px 20px; min-height: 48px; text-decoration: none;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 1px 0 rgba(255,255,255,.12) inset, 0 6px 16px -8px rgba(20,35,59,.55);
  transition: transform .15s ease, box-shadow .15s ease, background-color .15s ease, border-color .15s ease;
}
button:hover:not(:disabled), .btn:hover { transform: translateY(-1px); box-shadow: 0 1px 0 rgba(255,255,255,.12) inset, 0 10px 22px -10px rgba(20,35,59,.6); }
button:active:not(:disabled), .btn:active { transform: translateY(0) scale(.98); }
button.ghost, .btn.ghost {
  background: var(--surface); color: var(--ink); border-color: var(--line-strong); box-shadow: none;
}
button.ghost:hover:not(:disabled), .btn.ghost:hover { border-color: var(--ink); box-shadow: none; }
button.danger { background: transparent; color: var(--crit); border-color: color-mix(in srgb, var(--crit) 50%, transparent); box-shadow: none; }
button:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
button:focus-visible, .btn:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--sky) 55%, transparent); outline-offset: 2px;
}
a { color: var(--sky); text-underline-offset: 3px; }
a.small { text-decoration: none; font-weight: 500; }
a.small:hover { text-decoration: underline; }
input[type="text"], textarea {
  font: inherit; width: 100%; padding: 13px 16px; border-radius: 14px;
  border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--ink);
  transition: border-color .15s ease, box-shadow .15s ease, background-color .15s ease;
}
input[type="text"]:focus, textarea:focus { outline: none; border-color: var(--sky); background: var(--surface); box-shadow: 0 0 0 4px color-mix(in srgb, var(--sky) 18%, transparent); }
input.lien { font-size: 13px; color: var(--muted); }
textarea { min-height: 96px; resize: vertical; }
textarea.code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; word-break: break-all; }
.msg { font-size: 14px; padding: 12px 14px; border-radius: 14px; }
.msg.err { background: var(--crit-bg); color: var(--crit); }
.msg.good { background: var(--ok-bg); color: var(--ok); }

/* Listes de missions / candidats */
.mission-list { display: flex; flex-direction: column; gap: 10px; list-style: none; margin: 0; padding: 0; }
.mission-item {
  width: 100%; text-align: left; background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; min-height: 60px;
  display: flex; justify-content: space-between; align-items: center; gap: 12px; font-weight: 500;
  box-shadow: var(--shadow);
}
.mission-item:hover:not(:disabled) { border-color: var(--sky); box-shadow: var(--shadow-lg); }
.mission-item .name { min-width: 0; overflow-wrap: anywhere; font-family: var(--display); font-weight: 600; font-size: 16px; }
.mission-item::after { content: "→"; color: var(--muted); margin-left: 4px; }
.tag { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; padding: 3px 8px; border-radius: 999px; background: var(--sky-soft); color: var(--sky); font-weight: 700; }
.counts { color: var(--muted); font-size: 13px; white-space: nowrap; margin-left: auto; }

.pill { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.crit { background: var(--crit-bg); color: var(--crit); }

/* Lecture du radar */
.axis { display: flex; flex-direction: column; gap: 10px; padding-block: 16px; border-top: 1px solid var(--line); }
.axis:first-child { border-top: 0; padding-top: 0; }
.axis-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.track { position: relative; height: 24px; }
.track::before { content: ""; position: absolute; left: 0; right: 0; top: 9px; height: 6px; border-radius: 999px; background: linear-gradient(90deg, var(--sky-soft), var(--line)); }
.mark { position: absolute; top: 5px; width: 14px; height: 14px; margin-left: -7px; box-shadow: 0 0 0 3px var(--surface); }
.mark.d { background: var(--dir); transform: rotate(45deg); border-radius: 3px; }
.mark.e { background: var(--team); border-radius: 50%; }
.mark.c { background: var(--cand); clip-path: polygon(50% 0, 100% 100%, 0 100%); box-shadow: none; }
.poles { display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; color: var(--muted); }
.poles span { flex: 1 1 0; min-width: 0; }
.poles span:last-child { text-align: right; }
.legend { display: flex; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
.sw { width: 10px; height: 10px; display: inline-block; }
.sw.d { background: var(--dir); transform: rotate(45deg); border-radius: 2px; }
.sw.e { background: var(--team); border-radius: 50%; }
.sw.c { background: var(--cand); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.radar { width: 100%; max-width: 460px; height: auto; display: block; margin: 4px auto; }
.radar text { font-family: var(--body); font-size: 12px; font-weight: 500; fill: var(--ink); }
.radar .tick { font-size: 10px; fill: var(--muted); }
.dig { padding-block: 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.dig:first-child { border-top: 0; padding-top: 0; }
.dig q, .verb q { quotes: "« " " »"; }
.dig q { font-weight: 600; }
.pistes { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; }
.pistes li::marker { color: var(--sky); }
.verb { font-size: 14px; overflow-wrap: anywhere; padding: 10px 14px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); }
.verb b { font-weight: 600; }

/* Questionnaire */
.progress { height: 8px; background: color-mix(in srgb, var(--line) 80%, transparent); border-radius: 999px; overflow: hidden; }
.progress > i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--sky-2), var(--sky), var(--cand)); }
.q {
  display: flex; flex-direction: column; gap: 12px; padding: 20px; margin-bottom: 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow);
}
.q-stem { font-weight: 600; font-size: 17px; font-family: var(--display); letter-spacing: -.01em; line-height: 1.35; }
.q-poles { display: flex; justify-content: space-between; gap: 16px; font-size: 13.5px; color: var(--muted); }
.q-poles span { flex: 1 1 0; min-width: 0; }
.q-poles span:last-child { text-align: right; }
.scale { display: flex; justify-content: space-between; gap: 8px; }
.scale button {
  flex: 1 1 0; min-width: 0; padding: 0; height: 50px; border-radius: 14px;
  background: var(--surface-2); color: var(--muted); border: 1px solid var(--line-strong); font-weight: 600; box-shadow: none;
}
.scale button:hover:not(:disabled):not([aria-pressed="true"]) { border-color: var(--sky); color: var(--ink); box-shadow: none; }
.scale button[aria-pressed="true"] {
  background: linear-gradient(160deg, #3B8FCB, #14233B); color: #fff; border-color: transparent;
  box-shadow: 0 8px 18px -8px color-mix(in srgb, var(--sky) 70%, transparent); transform: scale(1.04);
}
.role-choice { display: grid; grid-template-columns: 1fr; gap: 10px; }
.role-choice button { justify-content: flex-start; padding-inline: 18px; min-height: 56px; border-radius: 16px; }
.role-choice button::after { content: "→"; margin-left: auto; color: var(--muted); }
.consent { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.consent input { width: 20px; height: 20px; margin-top: 2px; flex: none; accent-color: var(--sky); }
.site-foot { color: var(--muted); font-size: 12px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 12px; }
.site-foot svg { opacity: .6; }
@media (prefers-reduced-motion: no-preference) {
  .progress > i { transition: width .35s cubic-bezier(.2,.8,.2,1); }
  #app > * { animation: monte .35s cubic-bezier(.2,.8,.2,1) both; }
  #app > *:nth-child(2) { animation-delay: .04s; }
  #app > *:nth-child(3) { animation-delay: .08s; }
  #app > *:nth-child(4) { animation-delay: .12s; }
  @keyframes monte { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } .scale button[aria-pressed="true"] { transform: none; } }
</style>
<script src="config.js"></script>
</head>

<div class="topbar"><div class="topbar-in">
  <a class="brand-link" href="./" style="text-decoration:none;color:inherit"><header class="brand">

<div class="wrap">

      <ellipse cx="17" cy="31" rx="15" ry="6" fill="var(--ink)"/>

</div>

<script>
(function () {
  "use strict";

  /* ---------- Référentiel (version 4 du questionnaire) ----------
     Vague 1 direction / équipe : 7 thèmes de style x 4 questions + 4 questions de climat = 32.
     Vague 1 candidat : 7 thèmes x 4 questions + 7 questions d'importance = 35.
     Vague 2 : sur chaque thème en écart, 4 questions-hypothèses + 2 situations vécues + 1 commentaire libre.
     Chaque question : [énoncé, pôle gauche de l'axe, pôle droit de l'axe, affiché inversé].
     Les réponses sont toujours stockées dans le sens de l'axe (1 = pôle gauche, 5 = pôle droit). */
  var AXES = [
    { nom: "Prise de décision", court: "Décision", g: "Centralisée", d: "Déléguée", th: "Sur la prise de décision", desc: "qui décide, et quelle marge ont les équipes", q: [
      ["Les décisions qui touchent le quotidien de l'équipe sont prises", "par la direction", "par l'équipe concernée", false],
      ["Face à un imprévu, le plus souvent, un collaborateur", "fait valider avant d'agir", "agit, puis informe", true],
      ["La façon de réaliser une tâche est", "décrite par des procédures communes", "laissée au choix de chacun", false],
      ["Pour engager une dépense courante (matériel, prestataire), il faut", "l'accord d'un responsable", "simplement respecter son budget", true]
    ], p: [
      ["La dernière décision importante pour l'équipe a été prise", "par la direction seule", "avec l'équipe, ou par elle"],
      ["La dernière initiative prise sans demander a été", "recadrée", "laissée faire, voire saluée"]
    ]},
    { nom: "Relation à la hiérarchie", court: "Hiérarchie", g: "Formelle", d: "Proche", th: "Sur la relation à la hiérarchie", desc: "vouvoiement, accès au dirigeant, respect des circuits", q: [
      ["Entre les collaborateurs et la direction, on se", "vouvoie", "tutoie", false],
      ["Pour aborder un sujet avec le dirigeant, un collaborateur", "passe par son responsable direct", "va le voir directement", true],
      ["Les échanges avec la direction ont lieu surtout", "lors de réunions prévues", "à tout moment, de façon informelle", false],
      ["Les titres et les niveaux hiérarchiques", "comptent et se voient au quotidien", "s'effacent au quotidien", true]
    ], p: [
      ["La dernière fois qu'un collaborateur a voulu parler au dirigeant, il", "a demandé un rendez-vous", "est allé le voir directement"],
      ["Le dernier arrivé a rencontré le dirigeant", "lors d'un rendez-vous prévu", "dès ses premiers jours, sans formalité"]
    ]},
    { nom: "Organisation du travail", court: "Organisation", g: "Planifiée", d: "Réactive", th: "Sur l'organisation du travail", desc: "priorités, urgences, délais", q: [
      ["Les priorités", "restent les mêmes plusieurs mois", "changent plusieurs fois par trimestre", false],
      ["La charge de travail, d'une semaine à l'autre, est", "régulière", "très variable, avec des pics", true],
      ["Les projets sont lancés", "après une préparation complète", "vite, puis ajustés en route", false],
      ["Une journée type est", "planifiée à l'avance", "rythmée par les sollicitations du moment", true]
    ], p: [
      ["Le mois dernier, les urgences ont été", "rares", "presque quotidiennes"],
      ["Quand une nouvelle priorité arrive, les autres", "sont décalées", "s'y ajoutent"]
    ]},
    { nom: "Franc-parler", court: "Franc-parler", g: "Avec tact", d: "Sans détour", th: "Sur la façon de se dire les choses", desc: "façon de dire les critiques et les désaccords", q: [
      ["Quand un travail ne convient pas, la remarque est formulée", "avec ménagement", "directement", false],
      ["Les désaccords se règlent plutôt", "en tête-à-tête", "ouvertement, en réunion", true],
      ["Avec son responsable, un désaccord s'exprime", "en y mettant les formes", "franchement", false],
      ["Les messages écrits (mails, messageries) sont", "soignés et nuancés", "courts et directs", true]
    ], p: [
      ["La dernière fois qu'un collaborateur a contredit son responsable, c'était", "en privé", "devant les autres"],
      ["Les mauvaises nouvelles remontent à la direction", "après avoir été préparées", "immédiatement, telles quelles"]

        var a = analyser(m.reponses, m.v2);
        h += '<li><button type="button" class="mission-item" data-ouvrir="' + esc(m.id) + '">' +
          '<span class="name">' + esc(m.nom) + (m.exemple ? ' <span class="tag">Exemple</span>' : "") + '</span>' +
          '<span class="counts num">' + a.nd + ' dir. · ' + a.ne + ' équipe</span></button></li>';
      });
      h += '</ul>';
    }
    return h;
  }

  function vueMission(m, an) {
    var h = '<div class="stack"><a href="#cabinet" data-retour="1" class="small">← Toutes les missions</a>' +
      '<h1>' + esc(m.nom) + (m.exemple ? ' <span class="tag">Exemple</span>' : "") + '</h1>' +
      '<p class="lead num">' + pl(an.nd, "réponse") + ' direction · ' + pl(an.ne, "réponse") + ' équipe · ' + pl(an.cands.length, "candidat") + '</p></div>';

    if (an.pret) { h += vueAnalyse(an); h += vueSocle(an); h += vueV2(m, an); }
    else {
      var manque = [];
      if (an.nd < 1) manque.push("1 réponse de la direction");
      if (an.ne < MIN_TEAM) manque.push(pl(MIN_TEAM - an.ne, "réponse") + " de l'équipe");
      h += '<div class="panel stack"><h2>Radar en attente</h2><p>Il manque encore ' + manque.join(" et ") +
        '.</p><p class="small">Le radar s\'affiche à partir de ' + MIN_TEAM + ' réponses côté équipe, pour que personne ne soit identifiable dans les moyennes.</p></div>';
    }

    h += '<section class="stack"><h2>Candidats</h2>';
    if (!an.cands.length) {
      h += '<p class="small">Aucun candidat pour l\'instant. Envoyez le questionnaire candidat, puis ajoutez son code plus bas.</p>';
    } else {
      h += '<ul class="mission-list">';
      an.cands.forEach(function (c) {
        var txt = "En attente du radar";
        if (an.pret) {
          var nf = analyserCandidat(an, c).axes.filter(function (a) { return a.st[0] === "crit"; }).length;
          txt = nf ? pl(nf, "friction") : "Aucune friction";
        }
        h += '<li><button type="button" class="mission-item" data-cand="' + esc(c.i) + '">' +
          '<span class="name">' + esc(c.n) + '</span><span class="counts num">' + txt + '</span></button></li>';
      });
      h += '</ul>';
    }
    h += '</section>';

    h += '<section class="panel stack"><h2>Envoyer le questionnaire</h2>' +
      '<p class="small">Vague 1 : ' + N_DE + ' questions pour la direction et l\'équipe, ' + N_C + ' pour un candidat. Copiez le lien voulu et envoyez-le par e-mail ou SMS : il s\'ouvre directement sur le bon questionnaire.</p>' +
      blocLien("Direction", "d-" + m.id) + blocLien("Équipe", "e-" + m.id) + blocLien("Candidat", "c-" + m.id) +
      '<p class="small">Code de mission : <strong>' + esc(m.id) + '</strong></p></section>';

    h += '<form id="f-import" class="panel stack"><h2>Ajouter une réponse</h2>' +
      '<label class="small" for="in-code">Collez ici le code que le répondant vous a envoyé (il commence par CAIRN-). Vague 1, vague 2 et candidats : même champ.</label>' +
      '<textarea id="in-code" class="code" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>' +
      '<div class="row"><button type="submit" id="btn-import">Ajouter</button></div>' + blocMsg() + '</form>';

    h += '<div class="row">' + (S.confirmeSuppr
      ? '<span class="small">Supprimer cette mission et ses réponses ?</span><button type="button" class="danger" data-suppr="oui">Oui, supprimer</button><button type="button" class="ghost" data-suppr="non">Annuler</button>'
      : '<button type="button" class="ghost" data-suppr="demande">Supprimer la mission</button>') + '</div>';
    return h;
  }

  function vueAnalyse(an) {
    var tri = an.axes.slice().sort(function (a, b) { return b.gap - a.gap; });
    var marques = tri.filter(function (a) { return a.gap >= 1; });
    var aClar = tri.filter(function (a) { return a.gap >= 0.5 && a.gap < 1; });
    var synth;
    if (marques.length) synth = marques.length + " écart" + (marques.length > 1 ? "s marqués" : " marqué") + " sur " + AXES.length + " thèmes : " +
      marques.map(function (a) { return a.nom; }).join(", ") + ".";
    else if (aClar.length) synth = "Aucun écart marqué. " + pl(aClar.length, "thème") + " à clarifier : " +
      aClar.map(function (a) { return a.nom; }).join(", ") + ".";
    else synth = "Direction et équipe décrivent la même entreprise sur les " + AXES.length + " thèmes.";

    var h = '<section class="panel stack"><p class="label">Vague 1 · style de l\'entreprise</p><h2>' + esc(synth) + '</h2>' +
      '<div class="legend"><span><i class="sw d"></i>Direction</span><span><i class="sw e"></i>Équipe (moyenne)</span></div>' +
      radarSvg(an.axes) +
      '<p class="small">Échelle de 1 à 5. Plus un point s\'éloigne du centre, plus la réponse penche vers le second pôle du thème (' + esc(AXES.map(function (x) { return x.d.toLowerCase(); }).join(", ")) + '). Aucun pôle n\'est meilleur que l\'autre : seul l\'écart compte.</p></section>';

    h += '<section class="panel"><div class="stack" style="margin-bottom:14px"><h2>Thème par thème</h2></div>';
    tri.forEach(function (a) {
      var st = statut(a.gap);
      h += '<div class="axis"><div class="axis-head"><h3>' + esc(a.nom) + '</h3>' +
        '<span class="pill ' + st[0] + '">' + st[1] + ' · <span class="num">' + fr(a.gap) + '</span></span></div>' +
        piste(a, [["d", "Direction", a.dm], ["e", "Équipe", a.em]]) +
        (a.partage ? '<p class="small">L\'équipe elle-même est partagée sur ce thème : la moyenne masque des avis opposés.</p>' : "") +
        '</div>';
    });
    h += '</section>';

    var creuser = an.items.slice().sort(function (a, b) { return b.gap - a.gap; })
      .filter(function (i) { return i.gap >= 1; }).slice(0, 3);
    if (creuser.length) {
      h += '<section class="panel"><div class="stack" style="margin-bottom:14px"><h2>Les questions qui divisent le plus</h2></div>';
      creuser.forEach(function (i) {
        h += '<div class="dig"><p><q>' + esc(avecPoints(i.stem)) + '</q></p>' +
          '<p class="small">La direction répond ' + esc(penche(i.dm, i.g, i.d)) + ' <span class="num">(' + fr(i.dm) + ')</span>, ' +
          'l\'équipe ' + esc(penche(i.em, i.g, i.d)) + ' <span class="num">(' + fr(i.em) + ')</span>.</p></div>';
      });
      h += '</section>';
    }
    return h;
  }

  function vueSocle(an) {
    var alertes = an.socle.filter(function (s) { return statutSocle(s.em, s.dm)[0] === "crit"; });
    var vus = an.socle.filter(function (s) { return statutSocle(s.em, s.dm)[0] === "warn"; });
    var synth = alertes.length ? pl(alertes.length, "signal") + " d'alerte : " + alertes.map(function (s) { return s.nom; }).join(", ") + "."
      : vus.length ? "Pas d'alerte, mais " + (vus.length > 1 ? "des points vus" : "un point vu") + " différemment par la direction et l'équipe."
      : "L'équipe juge le climat de travail solide.";
    var h = '<section class="panel stack"><p class="label">Climat de travail</p><h2>' + esc(synth) + '</h2>' +
      '<p class="small">Ici, il ne s\'agit pas d\'un style : plus c\'est haut, mieux c\'est. Un climat où l\'équipe signale un manque de respect ou de sécurité pèse plus lourd sur les départs que le salaire. À aborder avec la direction avant tout recrutement.</p><div>';
    an.socle.forEach(function (s) {
      var st = statutSocle(s.em, s.dm);
      h += '<div class="axis"><div class="axis-head"><h3>' + esc(s.nom) + '</h3><span class="pill ' + st[0] + '">' + st[1] + '</span></div>' +
        '<p class="small">' + esc(s.stem) + (s.bas ? ' <span class="num">' + pl(s.bas, "membre") + ' de l\'équipe sur ' + an.ne + ' répond' + (s.bas > 1 ? "ent" : "") + ' 1 ou 2.</span>' : "") + '</p>' +
        piste({ g: "Rarement vrai", d: "Presque toujours vrai" }, [["d", "Direction", s.dm], ["e", "Équipe", s.em]]) + '</div>';
    });
    return h + '</div></section>';
  }

  function vueV2(m, an) {
    var actuels = axesEnEcart(an);
    var h = '<section class="panel stack"><p class="label">Vague 2</p><h2>Comprendre d\'où viennent les écarts</h2>';
    if (!m.v2) {
      if (!actuels) return h + '<p>Aucun écart à approfondir : la vague 2 n\'est pas nécessaire pour cette entreprise.</p></section>';
      h += '<p>Thèmes concernés : <strong>' + esc(nomsAxes(actuels)) + '</strong>.</p>' +
        '<p class="small">Sur chacun de ces thèmes, la direction et l\'équipe répondent à ' + PER2 + ' questions : quatre testent une explication possible de l\'écart, deux portent sur des situations vécues récemment. Un commentaire libre est proposé. Soit ' +
        (actuels.length * PER2) + ' questions en tout.</p>' +
        '<div class="row"><button type="button" data-v2="' + esc(actuels) + '">Lancer la vague 2</button></div></section>';
      return h;
    }
    var w = an.v2;
    h += '<p>Thèmes approfondis : <strong>' + esc(nomsAxes(m.v2)) + '</strong>. <span class="num">' + pl(w.nd, "réponse") + ' direction · ' + pl(w.ne, "réponse") + ' équipe.</span></p>' +
      '<p class="small">Envoyez ces liens aux mêmes personnes que pour la vague 1.</p>' +
      blocLien("Vague 2 direction", "d2-" + m.v2 + "-" + m.id) + blocLien("Vague 2 équipe", "e2-" + m.v2 + "-" + m.id);
    if (!w.pret) {
      var manque = [];
      if (w.nd < 1) manque.push("1 réponse de la direction");
      if (w.ne < MIN_TEAM) manque.push(pl(MIN_TEAM - w.ne, "réponse") + " de l'équipe");
      h += '<p class="small">Résultats en attente : il manque ' + manque.join(" et ") + '.</p>';
    }
    if (actuels && actuels !== m.v2) {
      h += '<p class="small">Les écarts ont changé depuis le lancement (aujourd\'hui : ' + esc(nomsAxes(actuels)) + '). Relancer met de côté les réponses de vague 2 déjà reçues.</p>' +
        '<div class="row"><button type="button" class="ghost" data-v2="' + esc(actuels) + '">Relancer sur les écarts actuels</button></div>';
    }
    h += '</section>';
    if (!w.pret) return h;

    w.axes.forEach(function (ax) {
      h += '<section class="panel stack"><p class="label">Vague 2 · ' + esc(ax.nom) + '</p><h2>Pistes d\'explication</h2><ul class="pistes">';
      pistes(ax).forEach(function (p) { h += '<li>' + esc(p) + '</li>'; });
      h += '</ul><h3>Situations vécues</h3><div>';
      ax.conc.forEach(function (l) {
        h += '<div class="axis"><p><strong>' + esc(avecPoints(l.stem)) + '</strong></p>' +
          piste(l, [["d", "Direction", l.dm], ["e", "Équipe", l.em]]) + '</div>';
      });
      h += '</div>';
      if (ax.verb.length) {
        h += '<h3>Ce qu\'ils en disent</h3>';
        ax.verb.forEach(function (v) {
          h += '<p class="verb"><b>' + (v.r === "d" ? "Direction" : "Équipe") + ' :</b> <q>' + esc(v.t) + '</q></p>';
        });
      }
      h += '</section>';
    });
    return h;
  }

  function vueCandidat(m, an, c) {
    var h = '<div class="stack"><a href="#cabinet" data-retourc="1" class="small">← ' + esc(m.nom) + '</a>' +
      '<p class="label">Candidat</p><h1>' + esc(c.n) + '</h1></div>';
    if (!an.pret) {
      h += '<div class="panel stack"><h2>Comparaison en attente</h2><p>Les réponses de ce candidat sont enregistrées. La comparaison s\'affichera quand le radar de l\'entreprise sera complet (1 réponse direction et ' + MIN_TEAM + ' réponses équipe).</p></div>';
    } else {
      var res = analyserCandidat(an, c);
      var tri = res.axes.slice().sort(function (a, b) {
        var o = { crit: 0, warn: 1, ok: 2 };
        return (o[a.st[0]] - o[b.st[0]]) || (b.gap - a.gap);
      });
      var fr2 = tri.filter(function (a) { return a.st[0] === "crit"; });
      var disc = tri.filter(function (a) { return a.st[0] === "warn"; });
      var synth;
      if (fr2.length) synth = fr2.length + " friction" + (fr2.length > 1 ? "s probables" : " probable") + " sur " + AXES.length + " thèmes : " +
        fr2.map(function (a) { return a.nom; }).join(", ") + ".";
      else if (disc.length) synth = "Aucune friction probable. " + pl(disc.length, "thème") + " à discuter : " +
        disc.map(function (a) { return a.nom; }).join(", ") + ".";
      else synth = "Ce que recherche le candidat correspond à ce que vit l'équipe sur les " + AXES.length + " thèmes.";
      h += '<section class="panel stack"><p class="label">Lecture</p><h2>' + esc(synth) + '</h2>' +
        '<div class="legend"><span><i class="sw c"></i>Candidat (préférence)</span><span><i class="sw e"></i>Équipe (vécu)</span><span><i class="sw d"></i>Direction (discours)</span></div>' +
        radarSvg(an.axes, res.axes.map(function (a) { return a.cm; })) +
        '<p class="small">Le candidat est comparé d\'abord à ce que vit l\'équipe : c\'est l\'environnement qu\'il trouvera en arrivant. Un écart ne devient une friction probable que sur un thème qu\'il juge important.</p></section>';

      h += '<section class="panel"><div class="stack" style="margin-bottom:14px"><h2>Thème par thème</h2></div>';
      tri.forEach(function (a) {
        var sens = a.cm > a.em ? a.d : a.g;
        h += '<div class="axis"><div class="axis-head"><h3>' + esc(a.nom) + '</h3>' +
          '<span class="pill ' + a.st[0] + '">' + a.st[1] + ' · <span class="num">' + fr(a.gap) + '</span></span></div>' +
          piste(a, [["d", "Direction", a.dm], ["e", "Équipe", a.em], ["c", "Candidat", a.cm]]) +
          '<p class="small num">Importance pour lui : ' + a.imp + '/5' +
          (a.gap >= 0.75 ? '. Il recherche un fonctionnement plus proche de « ' + esc(sens) + ' » que ce que vit l\'équipe.' : '.') + '</p>' +
          (a.discours ? '<p class="small">Attention : le candidat correspond à ce que décrit la direction, pas à ce que vit l\'équipe. C\'est le cas typique d\'une déception après l\'embauche.</p>' : "") +
          '</div>';
      });
      h += '</section>';

      var dire = res.items.filter(function (i) { return i.gap >= 1.5 && res.axes[i.ai].imp >= 3; })
        .sort(function (a, b) { return b.gap - a.gap; }).slice(0, 3);
      if (dire.length) {
        h += '<section class="panel"><div class="stack" style="margin-bottom:14px"><h2>À dire au candidat</h2>' +
          '<p class="small">Les points où ce qu\'il recherche s\'éloigne le plus du quotidien de l\'équipe, sur des thèmes qui comptent pour lui. À présenter franchement en entretien : une description réaliste du poste réduit les départs précoces.</p></div>';
        dire.forEach(function (i) {
          h += '<div class="dig"><p><q>' + esc(avecPoints(i.stem)) + '</q></p>' +
            '<p class="small">Le candidat recherche ' + esc(penche(i.cm, i.g, i.d)) + ' <span class="num">(' + i.cm + ')</span>, ' +
            'l\'équipe vit ' + esc(penche(i.em, i.g, i.d)) + ' <span class="num">(' + fr(i.em) + ')</span>.</p></div>';
        });
        h += '</section>';
      }
    }
    h += blocMsg() + '<div class="row">' + (S.confirmeSupprCand
      ? '<span class="small">Retirer ce candidat de la mission ?</span><button type="button" class="danger" data-supprc="oui">Oui, retirer</button><button type="button" class="ghost" data-supprc="non">Annuler</button>'
      : '<button type="button" class="ghost" data-supprc="demande">Retirer ce candidat</button>') + '</div>';
    return h;
  }

  function radarSvg(axes, cv) {
    var cx = 210, cy = 150, R = 96, n = axes.length;
    function pt(k, v) {
      var ang = (-90 + k * 360 / n) * Math.PI / 180, r = R * v / 5;
      return [cx + r * Math.cos(ang), cy + r * Math.sin(ang)];
    }
    function poly(vals) { return vals.map(function (v, k) { var p = pt(k, v); return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" "); }
    var s = '<svg class="radar" viewBox="0 0 420 300" role="img" aria-label="Radar comparant les réponses sur sept thèmes">';
    for (var ring = 1; ring <= 5; ring++) {
      s += '<polygon points="' + poly(axes.map(function () { return ring; })) + '" fill="none" stroke="var(--line)" stroke-width="1"/>';
    }
    axes.forEach(function (a, k) {
      var e = pt(k, 5), l = pt(k, 6.15);
      s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + e[0].toFixed(1) + '" y2="' + e[1].toFixed(1) + '" stroke="var(--line)" stroke-width="1"/>';
      var anchor = Math.abs(l[0] - cx) < 4 ? "middle" : (l[0] > cx ? "start" : "end");
      s += '<text x="' + l[0].toFixed(1) + '" y="' + (l[1] + 4).toFixed(1) + '" text-anchor="' + anchor + '">' + esc(a.court || a.nom) + '</text>';
    });
    s += '<text class="tick" x="' + (cx + 4) + '" y="' + (pt(0, 1)[1] + 3).toFixed(1) + '">1</text>';
    s += '<text class="tick" x="' + (cx + 4) + '" y="' + (pt(0, 5)[1] + 11).toFixed(1) + '">5</text>';
    s += '<polygon points="' + poly(axes.map(function (a) { return a.em; })) + '" fill="var(--team)" fill-opacity="0.22" stroke="var(--team)" stroke-width="2"/>';
    if (cv) {
      s += '<polygon points="' + poly(axes.map(function (a) { return a.dm; })) + '" fill="none" stroke="var(--dir)" stroke-width="1.5" stroke-dasharray="4 4"/>';
      s += '<polygon points="' + poly(cv) + '" fill="var(--cand)" fill-opacity="0.14" stroke="var(--cand)" stroke-width="2"/>';
    } else {
      s += '<polygon points="' + poly(axes.map(function (a) { return a.dm; })) + '" fill="var(--dir)" fill-opacity="0.10" stroke="var(--dir)" stroke-width="2"/>';
    }
    axes.forEach(function (a, k) {
      var e = pt(k, a.em), d = pt(k, a.dm);
      s += '<circle cx="' + e[0].toFixed(1) + '" cy="' + e[1].toFixed(1) + '" r="3.5" fill="var(--team)"/>';
      s += '<rect x="' + (d[0] - 3.5).toFixed(1) + '" y="' + (d[1] - 3.5).toFixed(1) + '" width="7" height="7" fill="var(--dir)" transform="rotate(45 ' + d[0].toFixed(1) + ' ' + d[1].toFixed(1) + ')"/>';
    });
    if (cv) cv.forEach(function (v, k) {
      var c = pt(k, v);
      s += '<polygon points="' + c[0].toFixed(1) + ',' + (c[1] - 4.5).toFixed(1) + ' ' + (c[0] + 4.5).toFixed(1) + ',' + (c[1] + 3.5).toFixed(1) + ' ' + (c[0] - 4.5).toFixed(1) + ',' + (c[1] + 3.5).toFixed(1) + '" fill="var(--cand)"/>';
    });
    return s + '</svg>';
  }

  /* ---------- Rendu : questionnaire ---------- */

        '<div class="atout"><i>◷</i><div><b>Moins de 10 min</b><span>Une trentaine de questions, sur téléphone ou ordinateur.</span></div></div>' +
        '<div class="atout"><i>◎</i><div><b>Confidentiel</b><span>Les réponses d\'équipe ne sont lues qu\'en moyenne.</span></div></div>' +
        '<div class="atout"><i>⇄</i><div><b>Sans bonne réponse</b><span>Aucun style n\'est meilleur qu\'un autre.</span></div></div>' +
      '</div>' +

      '<button type="submit" class="ghost" data-role="c" id="btn-role-c">Candidat</button></div>' + blocMsg() + '</form>';

    if (r.code) {
      return '<div class="stack">' + retour + '<h1>Merci, c\'est terminé</h1>' +
        '<p class="lead">Dernière étape : envoyez ce code à votre contact Cairn Affinités' + (CFG.email ? ' avec le bouton ci-dessous, ou' : ',') + ' par SMS ou par e-mail. Vos réponses ne sont transmises que par ce code.</p></div>' +
        '<div class="panel stack"><label class="label" for="out-code">Votre code réponse</label>' +
        '<textarea id="out-code" class="code" readonly>' + esc(r.code) + '</textarea>' +
        '<div class="row">' + (CFG.email ? '<a class="btn grow" id="btn-mail" href="mailto:' + encodeURIComponent(CFG.email) + '?subject=' + encodeURIComponent("Radar Cairn · " + r.slug + " · " + roleTxt) + '&body=' + encodeURIComponent(r.code) + '">Envoyer par e-mail</a>' : "") +
        (navigator.share ? '<button type="button" class="ghost grow" id="btn-partager">Partager (SMS…)</button>' : "") +
        '<button type="button" class="' + (CFG.email ? "ghost " : "") + 'grow" id="btn-copier">Copier le code</button></div><span class="small" id="copie-etat" role="status"></span>' +
        '<p class="small">' + (r.role === "e"
          ? "Le code ne contient pas votre nom. Seul votre contact Cairn sait qui l'a envoyé ; la direction ne voit que des moyennes d'équipe" + (r.w === 2 ? " et des commentaires non signés." : ".")
          : r.role === "c" ? "Le code contient le nom que vous avez indiqué, pour que votre contact vous reconnaisse. Vous pouvez lui demander la restitution de vos résultats."
          : "Le code ne contient pas votre nom.") + '</p></div>' +
        '<div class="row"><button type="button" class="ghost" id="btn-modifier">Modifier mes réponses</button></div>';
    }

    if (r.etape < 0) {
      var deja = r.a.some(function (v) { return v > 0; });
      var bouton = '<div class="row"><button type="button" id="btn-debut">' + (deja ? "Reprendre" : "Commencer") + '</button></div>';
      var regle = '<p class="small">Pour chaque question, deux descriptions se font face. Le côté de chaque description change d\'une question à l\'autre : lisez les deux avant de répondre.</p>';
      if (r.w === 2) return '<div class="stack">' + retour + '<p class="label">Vague 2 · ' + roleTxt + ' · mission ' + esc(r.slug) + '</p>' +
        '<h1>Quelques questions pour aller plus loin</h1>' +
        '<div class="row"><span class="chip num">' + total + ' questions</span><span class="chip num">≈ ' + minutes + ' min</span><span class="chip">Enregistrement automatique</span></div></div>' +
        '<div class="panel stack"><p>Sur ' + (pages.length > 1 ? "certains sujets" : "un sujet") + ' (<strong>' + esc(pages.map(function (p) { return p.titre; }).join(", ")) +
        '</strong>), la direction et l\'équipe n\'ont pas décrit l\'entreprise de la même façon. C\'est fréquent et ce n\'est pas un reproche : ces questions servent à comprendre pourquoi.</p>' +
        '<p class="small">Répondez à partir de situations que vous avez réellement vécues ces derniers mois. Un commentaire libre est possible sur chaque sujet ; évitez d\'y citer des noms.</p></div>' + bouton;
      if (r.role === "c") return '<div class="stack">' + retour + '<p class="label">Questionnaire candidat · mission ' + esc(r.slug) + '</p>' +
        '<h1>Dans quel environnement travaillez-vous le mieux ?</h1>' +
        '<div class="row"><span class="chip num">' + total + ' questions</span><span class="chip num">≈ ' + minutes + ' min</span><span class="chip">Enregistrement automatique</span></div></div>' +
        '<div class="panel stack"><p><strong>Pensez au poste où vous avez été le plus efficace et le plus à l\'aise</strong>, et décrivez comment il fonctionnait. Il n\'y a pas de bonne réponse : aucun des deux côtés n\'est meilleur que l\'autre, et des réponses « idéales » vous desserviraient en vous orientant vers un poste qui ne vous convient pas.</p>' + regle + '</div>' +
        '<div class="panel stack"><p class="label">Avant de commencer</p>' +
        '<p class="small">Ce questionnaire n\'est pas un test de personnalité. Il décrit l\'environnement de travail dans lequel vous êtes le plus efficace, pour le comparer à celui de l\'entreprise qui recrute. Vos résultats sont confidentiels : ils ne servent qu\'à cette candidature, et vous pouvez en demander la restitution à votre contact Cairn Affinités.</p>' +
        '<label class="consent" for="in-accord"><input type="checkbox" id="in-accord"' + (r.accord ? " checked" : "") + '><span>J\'ai lu ces informations et j\'accepte de répondre.</span></label>' +
        '<label class="label" for="in-prenom">Votre prénom et votre nom</label>' +
        '<input type="text" id="in-prenom" maxlength="40" autocomplete="name" value="' + esc(r.nom) + '">' + blocMsg() + '</div>' + bouton;
      return '<div class="stack">' + retour + '<p class="label">Questionnaire ' + roleTxt + ' · mission ' + esc(r.slug) + '</p>' +
        '<h1>Comment fonctionne vraiment votre entreprise ?</h1>' +
        '<div class="row"><span class="chip num">' + total + ' questions</span><span class="chip num">≈ ' + minutes + ' min</span><span class="chip">Enregistrement automatique</span></div></div>' +
        '<div class="panel stack"><p><strong>Décrivez ce que vous avez observé ces six derniers mois</strong>, pas ce qui serait souhaitable ni ce qui est écrit dans les documents officiels. Il n\'y a pas de bonne réponse : sur les ' + AXES.length + ' premiers thèmes, aucun des deux côtés n\'est meilleur que l\'autre.</p>' + regle +
        '<p class="small">Le même questionnaire est proposé à la direction et à l\'équipe. Cairn Affinités compare les descriptions pour recruter des personnes qui s\'y sentiront à leur place. ' +
        (r.role === "e" ? "Vos réponses sont anonymes pour l'entreprise : elle ne voit que des moyennes d'au moins " + MIN_TEAM + " personnes." : "") + '</p></div>' + bouton;
    }

    var pg = pages[r.etape], k0 = debutPage(pages, r.etape), faits = r.a.filter(function (v) { return v > 0; }).length;
    var h = '<div class="stack"><p class="label">' + (r.w === 2 ? "Vague 2 · " : "") + roleTxt + ' · partie ' + (r.etape + 1) + ' sur ' + pages.length + '</p>' +
      '<div class="progress" aria-hidden="true"><i id="barre" style="width:' + (faits / total * 100).toFixed(0) + '%"></i></div>' +
      '<h2>' + esc(pg.titre) + '</h2>' + (pg.lead ? '<p class="lead">' + esc(pg.lead) + '</p>' : "") + '</div><div>';
    pg.q.forEach(function (q, j) {
      var k = k0 + j, inv = q[3] === true;
      var gauche = inv ? q[2] : q[1], droite = inv ? q[1] : q[2];
      h += '<div class="q"><p class="q-stem" id="stem-' + k + '">' + esc(avecPoints(q[0])) + '</p>' +
        '<div class="q-poles"><span>' + esc(gauche) + '</span><span>' + esc(droite) + '</span></div>' +
        '<div class="scale" role="group" aria-labelledby="stem-' + k + '">';
      for (var p = 1; p <= 5; p++) {
        var sem = inv ? 6 - p : p;
        h += '<button type="button" id="q' + k + '-' + p + '" data-q="' + k + '" data-v="' + sem + '" aria-pressed="' + (r.a[k] === sem) +
          '" aria-label="' + p + ' sur 5, de « ' + esc(gauche) + ' » à « ' + esc(droite) + ' »">' + p + '</button>';
      }
      h += '</div></div>';
    });
    h += '</div>';
    if (pg.com) h += '<div class="stack"><label class="label" for="in-com">Un exemple ou une précision ? (facultatif)</label>' +
      '<textarea id="in-com" maxlength="' + MAXCOM + '" placeholder="Une situation récente qui illustre vos réponses, sans citer de nom">' + esc(r.k[r.etape] || "") + '</textarea></div>';
    h += '<div class="row"><button type="button" class="ghost" id="btn-prec">Précédent</button>' +
      '<button type="button" class="grow" id="btn-suiv"' + (etapeComplete() ? "" : " disabled") + '>' +
      (r.etape === pages.length - 1 ? "Terminer" : "Suivant") + '</button></div>';
    return h;
  }
  function etapeComplete() {
    var r = S.rep, pages = pagesRep(r), k0 = debutPage(pages, r.etape), n = pages[r.etape].q.length;
    for (var j = 0; j < n; j++) if (!r.a[k0 + j]) return false;
    return true;
  }
  function garderCommentaire() {
    var r = S.rep, c = document.getElementById("in-com");
    if (r && c && r.etape >= 0) r.k[r.etape] = c.value.replace(/\s+/g, " ").trim().slice(0, MAXCOM);
  }

  function rendre() {
    app.innerHTML = S.route.vue === "repondre" ? vueRepondre() : vueCabinet();
  }

  /* ---------- Actions ---------- */
  function idAlea() {
    var s = "", c = "abcdefghijklmnopqrstuvwxyz0123456789";
    for (var i = 0; i < 10; i++) s += c[Math.floor(Math.random() * c.length)];
    return s;
  }
  function missionCourante() { return S.missions.filter(function (x) { return x.id === S.courant; })[0] || null; }
  function copieReponses(m) {
    return (m.reponses || []).map(function (x) {
      var o = { r: x.r, a: x.a, i: x.i, t: x.t || "" };
      if (typeof x.v === "number") o.v = x.v;
      if (x.w === 2) { o.w = 2; o.x = x.x; o.k = Array.isArray(x.k) ? x.k.map(String) : []; }
      else if (x.r === "c") o.n = typeof x.n === "string" && x.n ? x.n : "Candidat";
      return o;
    });
  }

  function creerMission(nom) {
    nom = nom.trim();
    var base = slugify(nom);
    if (!nom || !base) { S.msg = { t: "Indiquez le nom de l'entreprise." }; return rendre(); }
    var slug = base, n = 2;
    var pris = function (s) { return S.missions.some(function (m) { return m.id === s; }); };
    while (pris(slug)) slug = base + "-" + (n++);
    S.msg = null;
    S.db.doc("missions/" + slug).set({ nom: nom.slice(0, 60), cree: new Date().toISOString().slice(0, 10), reponses: [] })
      .then(function () { S.courant = slug; rendre(); window.scrollTo(0, 0); })
      .catch(function () { S.msg = { t: "La mission n'a pas pu être créée. Vérifiez votre connexion et réessayez." }; rendre(); });
  }

  function importer(txt) {
    var m = missionCourante(); if (!m) return;
    var r = decodeReponse(txt);
    if (!r) { S.msg = { t: "Ce code n'est pas lisible. Demandez au répondant de le copier en entier, de CAIRN- jusqu'au dernier caractère." }; return rendre(); }
    if (r.ancien) { S.msg = { t: "Ce code vient d'une version précédente du questionnaire. Demandez au répondant de refaire le questionnaire actuel." }; return rendre(); }
    if (r.m !== m.id) { S.msg = { t: "Ce code appartient à la mission « " + r.m + " », pas à celle-ci." }; return rendre(); }
    if (r.w === 2) {
      if (!m.v2) { S.msg = { t: "Ce code est une réponse de vague 2, mais la vague 2 n'est pas lancée pour cette mission." }; return rendre(); }
      if (r.x !== m.v2) { S.msg = { t: "Ce code correspond à une vague 2 précédente, sur d'autres thèmes. Renvoyez le lien actuel au répondant." }; return rendre(); }
    }
    var liste = copieReponses(m);
    if (liste.some(function (x) { return x.i === r.i; })) { S.msg = { t: "Cette réponse a déjà été ajoutée." }; return rendre(); }
    var nv = { r: r.r, a: r.a, i: r.i, t: r.t, v: VERSION };
    if (r.w === 2) { nv.w = 2; nv.x = r.x; nv.k = r.k; }
    else if (r.r === "c") nv.n = r.n;
    liste.push(nv);
    var btn = document.getElementById("btn-import"); if (btn) btn.disabled = true;
    var qui = r.r === "d" ? "direction" : "équipe";
    S.db.doc("missions/" + m.id).update({ reponses: liste })
      .then(function () {
        S.msg = { ok: true, t: r.w === 2 ? "Réponse " + qui + " de vague 2 ajoutée." : r.r === "c" ? "Candidat " + r.n + " ajouté." : "Réponse " + qui + " ajoutée." };
        rendre();
      })
      .catch(function () { S.msg = { t: "La réponse n'a pas pu être enregistrée. Réessayez dans un instant." }; rendre(); });
  }

  function lancerV2(axes) {
    var m = missionCourante(); if (!m || !axesValides(axes)) return;
    S.db.doc("missions/" + m.id).update({ v2: { axes: axes, t: new Date().toISOString().slice(0, 10) } })
      .then(function () { S.msg = null; rendre(); })
      .catch(function () { S.msg = { t: "La vague 2 n'a pas pu être lancée. Réessayez dans un instant." }; rendre(); });
  }
  function retirerCandidat() {
    var m = missionCourante(), id = S.candidat; if (!m || !id) return;
    var liste = copieReponses(m).filter(function (x) { return !(x.r === "c" && x.i === id); });
    S.db.doc("missions/" + m.id).update({ reponses: liste })
      .then(function () { S.candidat = null; S.confirmeSupprCand = false; S.msg = null; rendre(); window.scrollTo(0, 0); })
      .catch(function () { S.confirmeSupprCand = false; S.msg = { t: "Le candidat n'a pas pu être retiré. Réessayez dans un instant." }; rendre(); });
  }
  function supprimerMission() {
    var id = S.courant; if (!id) return;
    S.db.doc("missions/" + id).delete()
      .then(function () { S.courant = null; S.confirmeSuppr = false; S.msg = null; rendre(); })
      .catch(function () { S.confirmeSuppr = false; S.msg = { t: "La mission n'a pas pu être supprimée." }; rendre(); });
  }
  function copier() {
    var ta = document.getElementById("out-code"), etat = document.getElementById("copie-etat");
    function repli() { ta.focus(); ta.select(); etat.textContent = "Code sélectionné : utilisez Copier."; }
    try {
      navigator.clipboard.writeText(S.rep.code).then(function () { etat.textContent = "Code copié."; }, repli);
    } catch (e) { repli(); }
  }

  app.addEventListener("click", function (ev) {
    var t = ev.target.closest("button, a"); if (!t) return;
    var r = S.rep;
    function haut() { rendre(); window.scrollTo(0, 0); }
    if (t.dataset.ouvrir) { S.courant = t.dataset.ouvrir; S.candidat = null; S.msg = null; S.confirmeSuppr = false; return haut(); }
    if (t.dataset.retour) { ev.preventDefault(); S.courant = null; S.candidat = null; S.msg = null; S.confirmeSuppr = false; return haut(); }
    if (t.dataset.cand) { S.candidat = t.dataset.cand; S.msg = null; S.confirmeSuppr = false; S.confirmeSupprCand = false; return haut(); }
    if (t.dataset.retourc) { ev.preventDefault(); S.candidat = null; S.msg = null; S.confirmeSupprCand = false; return haut(); }
    if (t.dataset.v2) { lancerV2(t.dataset.v2); return; }
    if (t.dataset.supprc) {
      if (t.dataset.supprc === "demande") { S.confirmeSupprCand = true; rendre(); }
      else if (t.dataset.supprc === "non") { S.confirmeSupprCand = false; rendre(); }
      else retirerCandidat();
      return;
    }
    if (t.dataset.suppr) {
      if (t.dataset.suppr === "demande") { S.confirmeSuppr = true; rendre(); }
      else if (t.dataset.suppr === "non") { S.confirmeSuppr = false; rendre(); }
      else supprimerMission();
      return;
    }
    if (t.dataset.q) {
      var k = +t.dataset.q, v = +t.dataset.v;
      r.a[k] = v; ecrireBrouillon();
      for (var i = 1; i <= 5; i++) {
        var b = document.getElementById("q" + k + "-" + i);
        b.setAttribute("aria-pressed", String(+b.dataset.v === v));
      }
      document.getElementById("btn-suiv").disabled = !etapeComplete();
      document.getElementById("barre").style.width = (r.a.filter(function (x) { return x > 0; }).length / r.a.length * 100).toFixed(0) + "%";
      return;
    }
    if (t.id === "btn-debut") {
      if (r.role === "c" && r.w !== 2) {
        var champ = document.getElementById("in-prenom"), acc = document.getElementById("in-accord");
        r.nom = champ ? champ.value.trim().slice(0, 40) : r.nom;
        r.accord = acc ? acc.checked : r.accord;
        if (!r.accord) { S.msg = { t: "Cochez la case pour confirmer que vous avez lu les informations." }; rendre(); return; }
        if (!r.nom) { S.msg = { t: "Indiquez votre prénom et votre nom pour commencer." }; rendre(); return; }
        S.msg = null;
      }
      var pages = pagesRep(r), prem = 0;
      for (var q = 0; q < r.a.length; q++) if (!r.a[q]) {
        for (var p = 0; p < pages.length; p++) if (q < debutPage(pages, p + 1)) { prem = p; break; }
        break;
      }
      r.etape = prem; return haut();
    }
    if (t.id === "btn-prec") { garderCommentaire(); r.etape -= 1; return haut(); }
    if (t.id === "btn-suiv") {
      if (!etapeComplete()) return;
      garderCommentaire();
      if (r.etape < pagesRep(r).length - 1) r.etape += 1;
      else {
        var charge = { v: VERSION, m: r.slug, r: r.role, a: r.a.join(""), i: idAlea(), t: new Date().toISOString().slice(0, 10) };
        if (r.w === 2) { charge.w = 2; charge.x = r.x.join(""); charge.k = r.k.slice(); }
        else if (r.role === "c") charge.n = r.nom || "Candidat";
        r.code = encodeReponse(charge);
      }
      return haut();
    }
    if (t.id === "btn-copier") { copier(); return; }
    if (t.dataset.copie) { copierTexte(t.dataset.copie, t); return; }
    if (t.id === "btn-partager") { try { navigator.share({ title: "Radar Cairn", text: r.code }); } catch (e) {} return; }
    if (t.id === "btn-sauver") { sauvegarder(); return; }
    if (t.id === "btn-modifier") { r.code = null; r.etape = 0; return haut(); }
  });

  app.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var f = ev.target;
    if (f.id === "f-nouvelle") {
      if (!S.db || S.charge === "attente") { S.msg = { t: "Vos missions sont encore en cours de chargement. Réessayez dans un instant." }; return rendre(); }
      creerMission(document.getElementById("in-nom").value);
    } else if (f.id === "f-import") {
      importer(document.getElementById("in-code").value);
    } else if (f.id === "f-entree") {
      var role = ev.submitter && ev.submitter.dataset.role;
      var slug = slugify(document.getElementById("in-mission").value);
      if (!slug || !role) { S.msg = { t: "Indiquez le code de mission, puis choisissez votre rôle." }; return rendre(); }
      location.hash = role + "-" + slug;
    }
  });

  window.addEventListener("hashchange", router);

  /* ---------- Démarrage ---------- */
  S.route = lireHash();
  if (S.route.vue === "repondre") demarrerReponse(S.route);
  rendre();

  /* Stockage local (cet appareil) : même interface que l'ancienne base. */
  var CLE = "cairn-radar-missions";
  var abonnes = [];
  function lireTout() { try { var o = JSON.parse(localStorage.getItem(CLE) || "{}"); return o && typeof o === "object" ? o : {}; } catch (e) { return {}; } }
  function ecrireTout(o) { localStorage.setItem(CLE, JSON.stringify(o)); notifier(); }
  function notifier() {
    var o = lireTout();
    var snap = { metadata: { fromCache: false }, docs: Object.keys(o).map(function (id) { return { id: id, data: function () { return o[id]; } }; }) };
    abonnes.forEach(function (f) { f(snap); });
  }
  var DB = {
    doc: function (chemin) {
      var id = chemin.split("/")[1];
      return {
        set: function (v) { return new Promise(function (ok) { var o = lireTout(); o[id] = v; ecrireTout(o); ok(); }); },
        update: function (v) { return new Promise(function (ok) { var o = lireTout(); o[id] = Object.assign({}, o[id] || {}, v); ecrireTout(o); ok(); }); },
        delete: function () { return new Promise(function (ok) { var o = lireTout(); delete o[id]; ecrireTout(o); ok(); }); }
      };
    },
    collection: function () { return { onSnapshot: function (f) { abonnes.push(f); setTimeout(notifier, 0); } }; }
  };
  window.addEventListener("storage", function (e) { if (e.key === CLE) notifier(); });

  function sauvegarder() {
    var blob = new Blob([JSON.stringify({ cairn: 1, date: new Date().toISOString(), missions: lireTout() }, null, 1)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "cairn-radar-sauvegarde-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  }
  app.addEventListener("change", function (ev) {
    if (ev.target.id !== "in-restaurer" || !ev.target.files[0]) return;
    var fr_ = new FileReader();
    fr_.onload = function () {
      try {
        var o = JSON.parse(fr_.result), m = o && o.missions;
        if (!m || typeof m !== "object") throw 0;
        var cur = lireTout(), n = 0;
        Object.keys(m).forEach(function (id) {
          if (!/^[a-z0-9-]{1,40}$/.test(id) || !m[id] || typeof m[id] !== "object") return;
          var ex = cur[id], rs = Array.isArray(m[id].reponses) ? m[id].reponses : [];
          if (ex && Array.isArray(ex.reponses)) {
            var vus = {}; ex.reponses.forEach(function (x) { vus[x.i] = 1; });
            rs = ex.reponses.concat(rs.filter(function (x) { return x && !vus[x.i]; }));
          }
          cur[id] = Object.assign({}, m[id], ex || {}, { reponses: rs }); n++;
        });
        ecrireTout(cur);
        S.msg = { ok: true, t: pl(n, "mission") + " restaurée" + (n > 1 ? "s" : "") + "." };
      } catch (e) { S.msg = { t: "Ce fichier n'est pas une sauvegarde du radar." }; }
      rendre();
    };
    fr_.readAsText(ev.target.files[0]);
  });

  S.db = DB;
  try { localStorage.setItem("cairn-test", "1"); localStorage.removeItem("cairn-test"); } catch (e) { S.charge = "absent"; }
  S.peutGerer = Object.keys(lireTout()).length > 0;
  DB.collection("missions").onSnapshot(function (snap) {
    S.missions = snap.docs.map(function (d) {
      var x = d.data() || {};
      return { id: d.id, nom: typeof x.nom === "string" ? x.nom : d.id, exemple: x.exemple === true,
               cree: typeof x.cree === "string" ? x.cree : "", reponses: Array.isArray(x.reponses) ? x.reponses : [],
               v2: x.v2 && axesValides(x.v2.axes) ? x.v2.axes : null };
    }).sort(function (a, b) { return (b.cree || "").localeCompare(a.cree || "") || a.nom.localeCompare(b.nom); });
    if (S.charge !== "absent") S.charge = "ok";
    if (S.missions.length) S.peutGerer = true;
    var actif = document.activeElement;
    var saisie = actif && (actif.id === "in-nom" || actif.id === "in-code") && actif.value;
    if (S.route.vue !== "repondre" && !saisie) rendre();
  });
})();
</script>

</body></html>
